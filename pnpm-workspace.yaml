packages:
  - "apps/*"
  - "packages/*"

# Force a single React/React DOM version across the workspace. Transitive
# dependencies (e.g. @floating-ui/react-dom via radix-ui) would otherwise pull
# a newer minor, which breaks libraries that rely on React context or module
# state shared across packages — in this repo that silently disabled sonner
# toasts rendered by @repo/ui.
overrides:
  react: "19.2.8"
  react-dom: "19.2.8"

# Dependencies allowed to run install scripts (pnpm 11 blocks them by default).
# esbuild needs its postinstall to fetch the platform binary.
allowBuilds:
  esbuild: true

# Centralized dependency versions. Reference these with `catalog:` in any
# package.json to keep versions consistent across the monorepo.
catalog:
  react: 19.2.8
  react-dom: 19.2.8
  next: 16.3.8
  next-themes: ^0.4.4
  lucide-react: ^0.468.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^2.6.0
  radix-ui: ^1.8.1
  sonner: ^2.0.7
  tw-animate-css: ^1.2.0
  zod: ^4.6.7
  react-hook-form: ^7.91.0
  "@hookform/resolvers": ^7.0.5
  vitest: ^5.1.0
  "@vitest/coverage-v8": ^5.1.0
  "@t3-oss/env-nextjs": ^0.13.11
  "@t3-oss/env-core": ^0.13.11
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  postgres: ^4.1.0
  "@electric-sql/pglite": ^0.5.15
  tailwindcss: ^4.1.0
  "@tailwindcss/postcss": ^4.1.0
  typescript: 7.0.2
  eslint: 10.9.1
  "@types/node": 26.4.1
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5

minimumReleaseAgeExclude:
  - "@hookform/resolvers@7.0.5"
